# Render Blueprint for the FastAPI AI service only (frontend/backend live on Vercel).
# Secrets are marked sync:false so you enter them in the Render dashboard, never in git.
services:
  - type: web
    name: mitramind-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
    # No persistent disk (free plan): the FAISS index is rebuilt on each start.
    # To keep it across restarts on a paid plan, add:
    #   disk: { name: faiss-index, mountPath: /srv/ai-service/data/faiss_index, sizeGB: 1 }
