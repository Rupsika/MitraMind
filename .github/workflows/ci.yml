name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
        env: { JWT_SECRET: ci-secret-ci-secret-ci-secret }
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "ai-service/requirements.txt" }
      - run: pip install -r ai-service/requirements.txt -r worker/requirements.txt
      - name: AI service tests
        run: python -m pytest -q
        working-directory: ai-service
      - name: Worker tests
        run: python -m pytest -q tests
        working-directory: worker
      - name: Safety evaluation (regression gate)
        run: python tests/evaluation/run_safety_eval.py
      - name: RAG evaluation
        # Skips itself (exit 0) when no key/index is available; runs for real when GOOGLE_API_KEY is a repo secret.
        run: python tests/evaluation/run_rag_eval.py
        env: { GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}" }

  e2e:
    # Cypress against the stack with the AI service mocked (see frontend/cypress/e2e/*.cy.ts).
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: |
          npm ci --prefix frontend
      - name: Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: "http://localhost:5173"
          browser: chrome

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -f ai-service/Dockerfile -t mitramind-ai .
          docker build -f worker/Dockerfile -t mitramind-worker .
          docker build -t mitramind-backend backend
          docker build -t mitramind-frontend frontend
